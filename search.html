<html>
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        background-color: black;
        color: yellow;
        font-family: unbounded;
      }
      #topbar {
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 10px;
      }
      #topbar input {
        width: 300px;
        height: 25px;
        box-sizing: border-box;
      }
      #searchResults {
        position: absolute;
        top: 30px;
        right: 10px;
        width: 300px;
        max-height: 250px;
        overflow-y: auto;
        background-color: black;
        z-index: 100;
      }
      #searchResults a {
        color: yellow;
      }
      #layout {
        display: flex;
      }
      #sidebar {
        width: 250px;
        height: calc(100vh - 30px);
        overflow-y: auto;
        background-color: black;
        font-size: 20px;
      }
      #sidebar a {
        color: yellow;
      }
      #main {
        flex: 1;
        text-align: center;
        padding-top: 20px;
      }
      #main img {
        display: block;
        margin: 0 auto;
      }
      #categories {
        margin: 15px 0;
      }
      #categories label {
        margin: 0 5px;
      }
      #search {
        width: 560px;
        height: 50px;
        box-sizing: border-box;
        background-color: black;
        border: 0.5px solid yellow;
        color: yellow;
        font-family: "Courier New", Courier, monospace;
        text-align: center;
      }
      #search::placeholder {
        color: yellow;
        text-align: center;
      }
      #results {
        width: 560px;
        max-height: 300px;
        overflow-y: auto;
        margin: 10px auto 0;
        text-align: left;
      }
      #results a {
        color: yellow;
      }
    </style>
  </head>
  <body>
    <div id="topbar">
      <a href="index.html" style="color: red;">Head back to main page</a>
      <span>Welcome to List-of-Websites!</span>
      <input type="text" id="linksearch" style="background-color: black; border: 0.5px solid yellow; color: yellow;" placeholder="Search for links">
    </div>
    <div id="searchResults"></div>
    <div id="layout">
      <div id="sidebar">
        <a href="android.html">Android</a><br>
        <a href="onion.html">Onion Links</a><br>
        <a href="links.html">Links Dump</a><br>
        <a href="downloading.html">Downloading</a><br>
        <a href="video.html">Video</a><br>
        <a href="tools.html">Tools</a><br>
        <a href="educational.html">Educational</a>
      </div>
      <div id="main">
        <img width="300" height="250" src="https://tikolu.net/i/hkpat">
        <h1 style="font-family: 'Courier New', Courier, monospace;">A Search...<br>For Everything.</h1>
        <div id="categories">
          <label>
            <input id="everything" type="checkbox" checked>Everything
          </label>
          <label>
            <input id="movies" type="checkbox">Movies
          </label>
          <label>
            <input id="games" type="checkbox">Games
          </label>
          <label>
            <input id="audio" type="checkbox">Audio
          </label>
          <label>
            <input id="apps" type="checkbox">Apps
          </label>
          <label>
            <input id="other" type="checkbox">Other
          </label>
        </div>
        <input type="text" placeholder="Search for anything you wish to find." id="search">
        <div id="results"></div>
      </div>
    </div>
    <script>
      let everything = document.getElementById("everything");
      let movies = document.getElementById("movies");
      let games = document.getElementById("games");
      let audio = document.getElementById("audio");
      let apps = document.getElementById("apps");
      let other = document.getElementById("other");
      let categories = [everything, movies, games, audio, apps, other];
      for (let category of categories) {
        category.addEventListener("change", function() {
          if (this.checked) {
            for (let otherCategory of categories) {
              if (otherCategory !== this) {
                otherCategory.checked = false;
              }
            }
          } else {
            this.checked = true;
          }
          doSearch();
        });
      }
      async function doSearch() {
        let query = document.getElementById("search").value.toLowerCase().trim();
        let results = document.getElementById("results");
        results.innerHTML = "";
        if (query === "") {
          return;
        }
        let files = [];
        if (everything.checked) {
          files = ["movies.html", "games.html", "audio.html", "apps.html", "other.html"];
        }
        if (movies.checked) {
          files = ["movies.html"];
        }
        if (games.checked) {
          files = ["games.html"];
        }
        if (audio.checked) {
          files = ["audio.html"];
        }
        if (apps.checked) {
          files = ["apps.html"];
        }
        if (other.checked) {
          files = ["other.html"];
        }
        results.innerHTML = "Searching...";
        let found = false;
        for (let file of files) {
          try {
            let response = await fetch(file);
            let html = await response.text();
            let parser = new DOMParser();
            let page = parser.parseFromString(html, "text/html");
            let links = page.querySelectorAll("a");
            for (let link of links) {
              if (link.textContent.toLowerCase().includes(query)) {
                let result = document.createElement("a");
                result.textContent = link.textContent;
                result.href = link.href;
                result.target = "_blank";
                result.style.color = "yellow";
                results.appendChild(result);
                results.appendChild(document.createElement("br"));
                found = true;
              }
            }
          } catch (error) {
            console.log("Could not search " + file);
          }
        }
        if (!found) {
          results.innerHTML = "No results found.";
        }
      }
      document.getElementById("search").addEventListener("input", doSearch);
      async function searchLinks() {
        let query = document.getElementById("linksearch").value.toLowerCase().trim();
        let results = document.getElementById("searchResults");
        if (query === "") {
          results.innerHTML = "";
          return;
        }
        const pages = ["index.html", "iptv.html", "links.html", "onion.html", "onionway.html", "piracy.html", "video.html", "android.html", "downloading.html", "tools.html", "educational.html"];
        results.innerHTML = "Searching...";
        let foundLinks = [];
        let seenLinks = new Set();
        for (const page of pages) {
          try {
            const response = await fetch(page);
            const html = await response.text();
            const parser = new DOMParser();
            const documentPage = parser.parseFromString(html, "text/html");
            const links = documentPage.querySelectorAll("a[href]");
            links.forEach(link => {
              const url = link.href;
              const text = link.textContent.trim();
              if (url.toLowerCase().includes(query) || text.toLowerCase().includes(query)) {
                if (!seenLinks.has(url)) {
                  seenLinks.add(url);
                  foundLinks.push({url: url, text: text || url});
                }
              }
            });
          } catch (error) {
            console.log("Could not search " + page);
          }
        }
        if (foundLinks.length === 0) {
          results.innerHTML = "No results found.";
        } else {
          results.innerHTML = "";
          foundLinks.forEach(link => {
            const result = document.createElement("div");
            const anchor = document.createElement("a");
            anchor.href = link.url;
            anchor.textContent = link.text;
            anchor.target = "_blank";
            anchor.style.color = "yellow";
            result.appendChild(anchor);
            results.appendChild(result);
          });
        }
      }
      document.getElementById("linksearch").addEventListener("input", searchLinks);
    </script>
  </body>
</html>
