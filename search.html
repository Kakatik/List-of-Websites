<html>
<head>
    <meta charset="UTF-8">
    <title>Search</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: black;
            color: yellow;
        }

        #searchContainer {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #searchType {
            margin-bottom: 15px;
            font-size: 18px;
        }

        #searchType label {
            margin: 0 10px;
            cursor: pointer;
        }

        #searchBox {
            width: 500px;
            height: 50px;
            font-size: 20px;
            box-sizing: border-box;
            background-color: black;
            color: yellow;
            border: 1px solid #222222;
            padding: 10px;
            outline: none;
        }

        #searchBox::placeholder {
            color: #808000;
            opacity: 1;
        }

        #results {
            width: 500px;
            height: 300px;
            margin-top: 20px;
            overflow-y: auto;
            overflow-x: hidden;
            border: 1px solid #222222;
            box-sizing: border-box;
            padding: 10px;
            text-align: left;
        }

        #results p {
            margin: 8px 0;
        }

        #results a {
            color: yellow;
        }

        @media (max-width: 600px) {
            #searchBox {
                width: 90%;
            }

            #results {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <div>
        <a style="color:red" href="index.html">Head back to main page</a>
        <a style="color:yellow" href="android.html">Android</a>
        <a style="color:yellow" href="onion.html">Onion Links</a>
        <a style="color:yellow" href="links.html">Links Dump</a>
        <a style="color:yellow" href="downloading.html">Downloading</a>
        <a style="color:yellow" href="video.html">Video</a>
        <a style="color:yellow" href="tools.html">Tools</a>
        <a style="color:yellow" href="educational.html">Educational</a>
    </div>

    <div id="searchContainer">

        <h1>Search for everything.</h1>

        <div id="searchType">

            <label>
                <input type="checkbox" name="" id="torrentCheck" checked />
                Torrent
            </label>

            <label>
                <input type="checkbox" name="" id="ddlCheck" />
                DDL
            </label>

        </div>

        <input
            type="text"
            id="searchBox"
            placeholder="Search..."
        />

        <div id="results"></div>

    </div>

    <script>
        let searchMode = "torrent";

        document.getElementById("torrentCheck").addEventListener("change", function() {
            if (this.checked) {
                document.getElementById("ddlCheck").checked = false;
                searchMode = "torrent";
                searchLinks();
            } else {
                this.checked = true;
            }
        });

        document.getElementById("ddlCheck").addEventListener("change", function() {
            if (this.checked) {
                document.getElementById("torrentCheck").checked = false;
                searchMode = "ddl";
                searchLinks();
            } else {
                this.checked = true;
            }
        });

        async function searchLinks() {

            const query = document
                .getElementById("searchBox")
                .value
                .toLowerCase();

            const results = document.getElementById("results");

            if (!query) {
                results.innerHTML = "";
                return;
            }

            try {

                let file;

                if (searchMode === "torrent") {
                    file = "magnets.html";
                } else {
                    file = "direct.html";
                }

                const response = await fetch(file);
                const html = await response.text();

                const parser = new DOMParser();
                const doc = parser.parseFromString(html, "text/html");

                let links;

                if (searchMode === "torrent") {
                    links = doc.querySelectorAll('a[href^="magnet:"]');
                } else {
                    links = doc.querySelectorAll('a[href]');
                }

                results.innerHTML = "";

                let found = false;

                links.forEach(link => {

                    if (
                        link.textContent
                            .toLowerCase()
                            .includes(query)
                    ) {

                        found = true;

                        const result = document.createElement("p");

                        const newLink = document.createElement("a");

                        newLink.href = link.href;
                        newLink.textContent = link.textContent;

                        result.appendChild(newLink);
                        results.appendChild(result);
                    }

                });

                if (!found) {
                    results.innerHTML = "No results found.";
                }

            } catch (error) {

                results.innerHTML = "Could not load the link list.";

                console.error(error);
            }
        }

        document
            .getElementById("searchBox")
            .addEventListener("input", searchLinks);

    </script>

</body>
</html>
